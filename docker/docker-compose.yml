services:
  minio:
    image: minio/minio:latest
    container_name: usp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: usp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: usp_data_lake
      POSTGRES_USER: usp
      POSTGRES_PASSWORD: usp123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usp -d usp_data_lake"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: usp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  generator-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: usp-generator-api
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: bronze
      MINIO_SECURE: "false"
      PYTHONPATH: /workspace
    ports:
      - "8001:8000"
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: ["uvicorn", "src.api.generator_api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  pipeline-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: usp-pipeline-api
    depends_on:
      - minio
      - postgres
      - qdrant
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: bronze
      MINIO_SECURE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_DB: usp_data_lake
      POSTGRES_USER: usp
      POSTGRES_PASSWORD: usp123
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: usp_news_embeddings
      EMBEDDING_MODEL: BAAI/bge-m3
      PYTHONPATH: /workspace
    ports:
      - "8002:8000"
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: ["uvicorn", "src.api.pipeline_api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  rag-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: usp-rag-api
    depends_on:
      - postgres
      - qdrant
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: usp_data_lake
      POSTGRES_USER: usp
      POSTGRES_PASSWORD: usp123
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: usp_news_embeddings
      EMBEDDING_MODEL: BAAI/bge-m3
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      PYTHONPATH: /workspace
    ports:
      - "8003:8000"
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: ["uvicorn", "src.api.rag_api:app", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  qdrant_data:
