services:
  minio:
    image: minio/minio:latest
    container_name: usp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: usp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: usp_data_lake
      POSTGRES_USER: usp
      POSTGRES_PASSWORD: usp123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usp -d usp_data_lake"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: usp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: usp-app
    depends_on:
      - minio
      - postgres
      - qdrant
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: bronze
      MINIO_SECURE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_DB: usp_data_lake
      POSTGRES_USER: usp
      POSTGRES_PASSWORD: usp123
      QDRANT_URL: http://qdrant:6333
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  qdrant_data:
